<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Legend Converse</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
    /* AUTHENTICATION PAGES STYLING */
body.auth-page {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #0f172a;
}

.auth-container {
  background: #ffffff;
  padding: 2.5rem;
  border-radius: 12px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
}

.auth-container h2 {
  margin-bottom: 0.5rem;
  color: #0f172a;
}

.auth-container p {
  color: #64748b;
  margin-bottom: 1.5rem;
  font-size: 0.95rem;
}

.form-group {
  margin-bottom: 1.25rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.4rem;
  font-weight: 600;
  color: #334155;
}

.form-group input, 
.form-group select {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: 1rem;
}

.btn-primary {
  width: 100%;
  padding: 0.8rem;
  background-color: #0284c7;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 0.5rem;
}

.btn-primary:hover {
  background-color: #0369a1;
}

.auth-switch {
  text-align: center;
  margin-top: 1.5rem;
}

.auth-switch a {
  color: #0284c7;
  text-decoration: none;
  font-weight: 600;
}
</style>
<body class="auth-page">

  <div class="auth-container">
    <h2>Create Your Account</h2>
    <p>Join Legend - Converse to connect and share expertise.</p>

    <form id="signup-form">
      <div class="form-group">
        <label for="full-name">Full Name:</label>
        <input type="text" id="full-name" required placeholder="e.g. Samson White">
      </div>

      <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="field-category">Primary Field/Skill:</label>
        <select id="field-category" required>
          <option value="">Select your main expertise</option>
          <option value="business">Business</option>
          <option value="sports">Sports</option>
          <option value="motivations">Motivations</option>
          <option value="fields">Explore Fields</option>
          <option value="tech">Technology</option>
          <option value="cultures">Explore Cultures</option>
          <option value="religion">Religion/Faith</option>
          <option value="agriculture">Agriculture</option>
          <option value="news">World News</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn-primary">Register Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
