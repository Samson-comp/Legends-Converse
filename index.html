<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legend's - Converse</title>
</head>
<body>
       <!--for styling purpose-->
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: clamp(16px, 4vw, 48px);
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.14), transparent 30%),
                radial-gradient(circle at 85% 85%, rgba(14, 165, 233, 0.12), transparent 32%),
                #f4f7fb;
        }

        form {
            width: min(100%, 450px);
            padding: clamp(24px, 5vw, 40px);
            background-color: #0f172a;
            border: 1px solid rgba(96, 165, 250, 0.45);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.22);
        }

        .container {
            width: 100%;
        }

        .heading {
            margin-bottom: 24px;
            padding-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(96, 165, 250, 0.35);
        }

        h3 {
            margin: 0 0 12px;
            color: #93c5fd;
            font: 700 clamp(24px, 6vw, 30px)/1.2 Georgia, 'Times New Roman', serif;
        }

        svg {
            display: block;
            width: 36px;
            height: 36px;
            margin: 0 auto;
            padding: 6px;
            background-color: #60a5fa;
            border-radius: 50%;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            color: #e2e8f0;
            font: 600 15px/1.4 'Trebuchet MS', sans-serif;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            color: #0f172a;
            background: #f8fafc;
            border: 2px solid transparent;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.18);
        }

        .remind {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 18px 0;
            color: #cbd5e1;
            font: 15px/1.4 'Trebuchet MS', sans-serif;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: #60a5fa;
        }

        .forget {
            text-align: right;
        }

        .forget a{
            color: #bfdbfe;
            font: 14px 'Trebuchet MS', sans-serif;
            text-decoration: none;
        }

        .forget a:hover {
            text-decoration: underline;
        }

        .action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 26px;
        }

        .action a{
            padding: 10px 2px;
            text-decoration: none;
            font: 600 15px 'Trebuchet MS', sans-serif;
            color: #bfdbfe;
        }

        .action a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .btn-submit {
            min-width: 120px;
            min-height: 46px;
            padding: 11px 22px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font: 600 16px 'Trebuchet MS', sans-serif;
            cursor: pointer;
            transition: transform 160ms ease, background-color 160ms ease;
        }

        .btn-submit:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .btn-submit:focus-visible,
        a:focus-visible {
            outline: 3px solid #7dd3fc;
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            form {
                padding: 24px 20px;
                border-radius: 18px;
            }

            .action {
                align-items: stretch;
                flex-direction: column-reverse;
                text-align: center;
            }

            .btn-submit {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
        <form action="login" id="login-form" method="POST">
            <div class="container">
           
                <div class="heading">
                     <h3>Login to Your Account</h3>
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000">

                    </svg>
                </div>
            
                <label for="login-email">Username / Email</label>
            
                <input  type="text" id="login-email" placeholder="Samson" required>
            
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="••••••••••••••••" required>
            
                <div class="remind">
                    <input type="checkbox" id="remember-me" class="checkbox">
                    Remember Me!
                </div>
            
                <div class="forget">
                    <a href="#">Forget Password! </a>
                </div>
                <div class="action">
                    <a href="signup.html" class="btn-back" id="back">Signup</a>
                    <button class="btn-submit" id="submit" type="submit">Submit </button>
                </div>
            </div>
        </form>
    <script src="auth.js"></script>
</body>
</html>
